services:
  - type: web
    name: hidden-gems
    env: node
    plan: free
    buildCommand: npm install && npm --prefix client install && npm --prefix client run build
    startCommand: node server/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hidden-gems-db
          property: connectionString
databases:
  - name: hidden-gems-db
    plan: free
